databases:
  - name: lavueltasessions-db
    databaseName: lavueltasessions
    user: lavuelta_user
    plan: free

services:
  - type: web
    name: la-vuelta-sessions
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lavueltasessions-db
          property: connectionString
      - key: QR_HMAC_SECRET
        generateValue: true
